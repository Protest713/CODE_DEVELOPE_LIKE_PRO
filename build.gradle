plugins {
    id 'java'
//    id 'io.qameta.allure' version '2.11.2'
    id "io.qameta.allure" version "2.12.0"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    // Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.20.0'

    // WebDriverManager
    implementation 'io.github.bonigarcia:webdrivermanager:5.7.0'

    // Cucumber + TestNG
    testImplementation 'io.cucumber:cucumber-java:7.16.0'
    testImplementation 'io.cucumber:cucumber-testng:7.16.0'
    testImplementation 'org.testng:testng:7.8.0'

    // =========================
    // ALLURE REPORTING
    // =========================
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.24.0'
    testImplementation 'io.qameta.allure:allure-testng:2.24.0'
    implementation 'io.qameta.allure:allure-java-commons:2.24.0'

    // Logging
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'

    // Utilities
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'commons-io:commons-io:2.8.0'

    // Database
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'org.springframework:spring-jdbc:5.3.30'
    implementation 'org.apache.commons:commons-dbcp2:2.9.0'
}

//tasks.register('runTests') {
//    group = "verification"
//    description = "Runs all tests"
//    dependsOn test
//}

tasks.register('runTests') {

    group = "verification"
    description = "Runs all tests"

    dependsOn test

    finalizedBy allureReport
}

test {

    useTestNG()

    // Allure Results Path
    systemProperty "allure.results.directory",
            file("$buildDir/allure-results")

    // Detailed logs
    testLogging {

        events "PASSED", "FAILED", "SKIPPED"

        exceptionFormat "FULL"

        showExceptions true
        showCauses true
        showStackTraces true

        showStandardStreams = true
    }
}

allure {

    version = '2.24.0'

    useTestNG {
        version = '2.24.0'
    }

    autoconfigure = true
    aspectjweaver = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}